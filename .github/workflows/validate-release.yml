name: Validate legacy Windows updates
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate
        required: true
permissions:
  contents: read
jobs:
  compatibility:
    if: ${{ !github.event.release.prerelease }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install packaging requests
      - name: Check full installer, hash and internal version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python scripts/publish_release.py --tag $env:RELEASE_TAG --check-only
      - name: Check historical updater implementations
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" | Set-Content release.json -Encoding utf8
          python scripts/check_legacy_updates.py release.json
